<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flask Weather App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: #ffffff;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #1e293b; }
    form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    input:focus { border-color: #3b82f6; }
    button {
      padding: 0.75rem 1.25rem;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .weather-result { margin-top: 1rem; }
    .location { font-size: 1.25rem; font-weight: 600; color: #334155; }
    .temp { font-size: 3.5rem; font-weight: 800; color: #0f172a; margin: 0.5rem 0; }
    .condition { text-transform: capitalize; color: #64748b; font-size: 1.1rem; }
    .details {
      display: flex;
      justify-content: space-around;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e2e8f0;
      color: #475569;
      font-size: 0.9rem;
    }
    .details div span { display: block; font-weight: 700; color: #0f172a; margin-top: 0.25rem; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Current Weather</h1>
    
    <form method="POST">
      <input type="text" name="city" placeholder="Enter city name..." required autofocus>
      <button type="submit">Search</button>
    </form>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    {% if weather %}
      <div class="weather-result">
        <div class="location">{{ weather.city }}, {{ weather.country }}</div>
        <img src="https://openweathermap.org/img/wn/{{ weather.icon }}@2x.png" alt="Weather icon">
        <div class="temp">{{ weather.temp }}°C</div>
        <div class="condition">{{ weather.description }}</div>

        <div class="details">
          <div>Feels Like<span>{{ weather.feels_like }}°C</span></div>
          <div>Humidity<span>{{ weather.humidity }}%</span></div>
          <div>Wind<span>{{ weather.wind_speed }} m/s</span></div>
        </div>
      </div>
    {% endif %}
  </div>

</body>
</html>
